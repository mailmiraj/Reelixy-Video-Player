plugins {
    id 'com.android.application'
}

android {
    namespace 'com.reelixy.videoplayer'
    compileSdk 33

    defaultConfig {
        applicationId "com.reelixy.videoplayer"
        minSdk 23
        targetSdk 33
        versionCode 100
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding false
    }
}

// AndroidIDE injects its own LogSender dependency (pulls kotlin-stdlib 1.8.10)
// which otherwise collides with the older kotlin-stdlib-jdk7/jdk8 1.7.20
// artifacts pulled in transitively elsewhere. Those jdk7/jdk8 artifacts are
// empty stub jars from Kotlin 1.8+ onward anyway, so dropping them is safe.
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation 'androidx.core:core:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.6.1'

    // Media3 / ExoPlayer
    implementation 'androidx.media3:media3-exoplayer:1.1.1'
    implementation 'androidx.media3:media3-ui:1.1.1'
    implementation 'androidx.media3:media3-session:1.1.1'
    implementation 'androidx.media3:media3-common:1.1.1'

    // Persistence (favorites / playback history / playlists) is implemented
    // with a plain SQLiteOpenHelper — see database/DatabaseHelper.java.
    // Room's annotation processor was removed: its compile-time SQL verifier
    // needs a native sqlite-jdbc library that fails to load in on-device
    // build environments like AndroidIDE/Termux (no glibc), and no
    // combination of Room's skip-verification flags avoided it.

    // Image / thumbnail caching
    implementation 'com.github.bumptech.glide:glide:4.15.1'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.15.1'
}
